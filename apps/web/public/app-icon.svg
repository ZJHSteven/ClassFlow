<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    ClassFlow 的图形语义：
    - 深青色圆角底：沿用控制台主视觉，和普通蓝色“校园 App”区分开。
    - 象牙白双页：课堂 / Notes。
    - 薄荷色流线：音频、ASR、Notes 之间连续流动的 pipeline。
    - 琥珀色节点：一次课堂最终落成一个可读成果。
    不使用文字、星星或通用铃铛，缩到 iOS 主屏幕尺寸仍能一眼识别。
  -->
